# ===================================================================
# Online Quiz Management System - Application Configuration
# ===================================================================

# Application Info
spring.application.name=online-quiz-system
server.port=8080

# Active Profile (defaults to h2 for zero-setup running; switch to 'mysql' for production)
spring.profiles.active=h2

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Disable open-in-view to avoid LazyInitializationException warnings in production
spring.jpa.open-in-view=false

# Jackson JSON Formatter Settings
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
